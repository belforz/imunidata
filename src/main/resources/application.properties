spring.application.name=imunidata

# H2 Database
spring.datasource.url=jdbc:h2:mem:vacinacaodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# jdbc:h2:mem:vacinacaodb;DB_CLOSE_DELAY=-1

# Server Port: Use PORT environment variable if set, otherwise default to 8080
server.port=${PORT:8080}

springdoc.swagger-ui.path=/api/v1/swagger-ui.html
springdoc.api-docs.path=/api/v1/api-docs

# Logging: ensure scheduled pings and request logs at INFO are shown in platform logs
logging.level.root=INFO
logging.level.com.example.imunidata=INFO
logging.level.org.springframework.web=INFO

