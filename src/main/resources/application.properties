spring.application.name=imunidata

# H2 Database
spring.datasource.url=jdbc:h2:mem:vacinacaodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Server
# Use the PORT environment variable provided by the hosting platform (ex: Render).
# Falls back to 8080 when PORT is not set (local development).
server.port=${PORT:8080}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
